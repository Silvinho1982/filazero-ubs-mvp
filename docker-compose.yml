services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/filazero
      DATABASE_USER: filazero
      DATABASE_PASSWORD: filazero
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: filazero
      POSTGRES_USER: filazero
      POSTGRES_PASSWORD: filazero
    ports:
      - "5432:5432"
    volumes:
      - filazero-db:/var/lib/postgresql/data

volumes:
  filazero-db:
